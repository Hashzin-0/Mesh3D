services:
  web:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    volumes: [".:/workspace", "/workspace/node_modules"]
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on: [api]
  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    volumes:
      - mesh3d-data:/data
      - ./engine-wrappers:/opt/mesh3d/wrappers:ro
      - ./engines:/opt/mesh3d/engines:ro
    env_file: .env
    environment:
      MESH3D_DATA_DIR: /data
      MESH3D_CORS_ORIGINS: http://localhost:5173
      HF_HOME: /data/model-cache/huggingface
      TORCH_HOME: /data/model-cache/torch
volumes:
  mesh3d-data:
